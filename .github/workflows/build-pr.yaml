name: Validate Chiaki-ngx release packages
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: required-release-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-validation:
    name: Required Windows x64 and Linux x64
    uses: ./.github/workflows/build-release-assets.yml
    with:
      target: all
