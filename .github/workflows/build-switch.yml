name: Build chiaki-ngx for Switch

on:
  workflow_dispatch:

jobs:
  build-switch_x64:
    name: Build chiaki-ngx switch_x64
    runs-on: ubuntu-latest

    steps:
      - name: Setup Docker
        run: |
          sudo apt-get update
          sudo apt-get -y install docker-ce-cli

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'chiaki-ngx'

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Run build script
        working-directory: chiaki-ngx
        run: |
          chmod +x scripts/switch/run-docker-build-chiaki.sh
          scripts/switch/run-docker-build-chiaki.sh

      - name: Upload chiaki-ngx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ngx.nro
          path: chiaki-ngx/build_switch/switch/chiaki-ngx.nro
          if-no-files-found: error
          retention-days: 7
