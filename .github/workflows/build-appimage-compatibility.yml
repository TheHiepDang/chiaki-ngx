name: Build chiaki-ngx Appimage Compatibility

on:
  workflow_dispatch:

jobs:
  build-appimage_compat_x64:
    name: Build compatibility chiaki-ngx appimage_x64
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'chiaki-ngx'

      - name: Add QmlWebEngine Import
        working-directory: chiaki-ngx
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/
      - name: Run build script
        working-directory: chiaki-ngx/scripts
        run: |
          ./run-podman-build-compatibility-appimage.sh

      - name: Upload chiaki-ngx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ngx-compatibility.AppImage
          path: chiaki-ngx/appimage/chiaki-ngx-compatibility.AppImage
          if-no-files-found: error
          retention-days: 7
