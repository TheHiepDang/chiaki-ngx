name: Optional Chiaki-ngx platform checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: optional-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    uses: ./.github/workflows/build-macos-arm.yml
  build-appimage_arm64:
    name: Build chiaki-ngx appimage_arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: 'recursive'
          path: 'chiaki-ngx'

      - name: Add QmlWebEngine Import
        working-directory: chiaki-ngx
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Run build script
        working-directory: chiaki-ngx
        run: |
          set -xe
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.7 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"
          cp appimage/chiaki-ngx.AppImage appimage/chiaki-ngx.AppImage_arm64

      - name: Upload chiaki-ngx Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chiaki-ngx.AppImage_arm64
          path: chiaki-ngx/appimage/chiaki-ngx.AppImage_arm64
          if-no-files-found: error
          retention-days: 7
