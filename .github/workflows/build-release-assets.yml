name: Chiaki-ngx verified release assets
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: all
      version:
        type: string
        default: ''
    outputs:
      tag:
        value: ${{ jobs.prepare.outputs.tag }}
      commit:
        value: ${{ jobs.prepare.outputs.commit }}
      tag_object:
        value: ${{ jobs.prepare.outputs.tag_object }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      windows: ${{ steps.source.outputs.windows }}
      linux: ${{ steps.source.outputs.linux }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, exact commit and main ancestry
        id: source
        env:
          TEST_TAG: ${{ inputs.version }}
          TARGET: ${{ inputs.target || 'all' }}
        run: python3 scripts/ci/release.py prepare --tag "$TEST_TAG" --target "$TARGET"
      - name: Release policy tests
        run: python3 -m unittest discover -s scripts/ci/tests -v

  windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      QT_FORCE_STDERR_LOGGING: '1'
    steps:
      - name: Use LF for scripts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: NVIDIA/DLSS
          ref: 9981c6350dc58c0ce21f024fd65e31e851c31689
          path: deps/nvidia-sdk
          sparse-checkout: |
            include
            LICENSE.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Record source/version and fetch locked Windows packages
        run: |
          python scripts/ci/release.py stamp --tag "$TAG" --commit "$COMMIT"
          python scripts/ci/release.py download --group msys --folder deps/msys
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: CLANG64
          update: false
          cache: false
          install: git diffutils make unzip zip
      - name: Compile, test and deploy the MSYS2 GUI
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash scripts/ci/build-windows.sh 2>&1 | tee build/ci/windows-build.log
      - name: Build the MSVC worker and validate its models
        shell: pwsh
        run: |
          ./scripts/Build-EnhancementWorker.ps1 -NgxSdkPath deps/nvidia-sdk -BuildDirectory build/ci-worker -SkipGpuSelfTest 2>&1 | Tee-Object build/ci/worker-build.log
      - name: Package portable and installer; verify both payloads
        shell: pwsh
        run: |
          ./scripts/ci/package-windows.ps1 -Tag $env:TAG 2>&1 | Tee-Object build/ci/windows-package.log
      - name: Record verified Windows assets
        run: python scripts/ci/release.py assets --platform windows --folder dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-windows
          path: |
            build/ci/*.log
            build/ci/*packages.txt
            build/ci-*/Testing/Temporary/*.log
            ${{ runner.temp }}/chiaki-package-logs/
          if-no-files-found: ignore
          retention-days: 14

  linux:
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      QT_FORCE_STDERR_LOGGING: '1'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - name: Record source/version
        run: python3 scripts/ci/release.py stamp --tag "$TAG" --commit "$COMMIT"
      - name: Install container tool and desktop runtime baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y podman libvulkan1 libegl1 libgl1
      - name: Build with the existing AppImage toolchain
        run: |
          image=$(python3 -c 'import json; print(json.load(open("scripts/ci/dependencies.json"))["linux_image"])')
          # build-linux.sh uses AppImage extraction mode; no FUSE/SYS_ADMIN grant.
          podman run --rm \
            -v "$PWD:/build/chiaki" -w /build/chiaki "$image" \
            /bin/bash -c 'sudo -E bash scripts/ci/build-linux.sh' 2>&1 | tee build/ci/linux-build.log
      - name: Validate the actual AppImage outside the build container
        run: |
          bash scripts/ci/verify-appimage.sh appimage/chiaki-ngx.AppImage "${TAG#v}" 2>&1 | tee build/ci/linux-package.log
          mkdir -p dist
          cp appimage/chiaki-ngx.AppImage "dist/chiaki-ngx-linux-x86_64-${TAG}.AppImage"
          python3 scripts/ci/release.py assets --platform linux --folder dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve Linux diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-linux
          path: |
            build/ci/*.log
            build/ci/linux-smoke/
            build/ci-*/Testing/Temporary/*.log
            build_appimage/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 14

