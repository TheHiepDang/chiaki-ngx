name: Build chiaki-ngx flatpak arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    name: Build chiaki-ngx flatpak_arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'chiaki-ngx'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          git \
          flatpak \
          flatpak-builder

      - name: Setup Flatpak Builder Environment
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install org.kde.Sdk//6.9 -y
          flatpak install org.kde.Platform//6.9 -y
          flatpak install io.qt.qtwebengine.BaseApp//6.9 -y
          flatpak update --appstream --assumeyes

      - name: Build Flatpak package
        working-directory: chiaki-ngx
        run: |
          flatpak-builder --repo=chiaki-ngx --force-clean build-dir scripts/flatpak/io.github.streetpea.Chiaki4deck.yaml

      - name: Bundle Flatpak app
        working-directory: chiaki-ngx
        run: |
          flatpak build-bundle chiaki-ngx chiaki-ngx-arm64.flatpak io.github.streetpea.Chiaki4deck --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          flatpak build-bundle chiaki-ngx --runtime chiaki-ngx-arm64-debug.flatpak io.github.streetpea.Chiaki4deck.Debug --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - name: Upload chiaki-ngx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ngx-arm64.flatpak
          path: chiaki-ngx/chiaki-ngx-arm64.flatpak
          if-no-files-found: error
          retention-days: 1
      - name: Upload chiaki-ngx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ngx-arm64-debug.flatpak
          path: chiaki-ngx/chiaki-ngx-arm64-debug.flatpak
          if-no-files-found: error
          retention-days: 1
