name: Release Chiaki-ngx
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Validation only (never publishes)'
        type: choice
        options: [all, windows, linux]
        default: all
      version:
        description: 'Optional vMAJOR.MINOR.PATCH[-rc.N] test label; no tag is created'
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: chiaki-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build-release-assets.yml
    with:
      target: ${{ inputs.target || 'all' }}
      version: ${{ inputs.version || '' }}
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'TheHiepDang/chiaki-ngx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify draft uploads and updater metadata, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          python3 scripts/ci/release.py publish --folder dist --tag "$TAG" \
            --commit "$COMMIT" --tag-object "$TAG_OBJECT"
